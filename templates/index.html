<html lang="en">
<head>
    <title>Home</title>
    <script src="{{ url_for('static', filename='scripts/frontendScript.js') }}" defer></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/style.css') }}">
</head>

<body>
<div id="generalContainer">
    <!-- left side -->

    <canvas id="warehouseCanvas" width="200" height="100" style="border:1px solid #000000;"></canvas>


    <!-- right side -->
    <div id="inputSection">
        <h1>Travelling Salesman Problem in Manhattan Networks</h1>
        <div id="warehouseFloorPlanSection">
            <label for="warehouseAisleCount">Number of Aisles:</label>
            <input type="number" id="warehouseAisleCount" placeholder="Number of Aisles" value="4"/>
            <label for="warehouseCrossingCount">Number of Rows:</label>
            <input type="number" id="warehouseCrossingCount" placeholder="Number of Crossings" value="3"/>
            <button id="changeWarehouseFloorPlan">Change Warehouse Floorplan</button>
        </div>
        <div id="testLocationsSection">
            <label for="locationCount">Product Count</label>
            <input type="number" id="locationCount" name="locationCount" placeholder="Number of Locations"/>
            <button id="generateLocationsButton" type="submit">Generate To Be Visited Stock Locations</button>
        </div>
        <div id="algorithmSelection">
            <div>
                <label>
                    <input type="checkbox" id="greedyHeuristic" name="selections" value="christofides">
                    Christofides Heuristic
                </label>
                <label>
                    <input type="checkbox" id="NearestNeighborHeuristic" name="selections" value="nearestNeighbor">
                    Nearest Neighbor Heuristic
                </label>
                <label>
                    <input type="checkbox" id="fixedParameterAlgorithm" name="selections" value="fixedParameter">
                    Fixed Parameter Algorithm
                </label>
            </div>
            <button id="triggerRouteCalculationButton">Run Algorithm</button>
        </div>

        <div id="locationTableContainer">
            <h2>Stock Locations</h2>
            <table id="locationTable">
                <thead>
                <tr>
                    <th>Location Number</th>
                    <th>X Coordinate</th>
                    <th>Y Coordinate</th>
                </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
